<rect x="148" y="250" width="96" height="22" class="lbg"/>
<text x="196" y="265" class="h" text-anchor="middle">equivalence</text>
<rect x="364" y="238" width="136" height="36" class="lbg"/>
<text x="432" y="252" class="h" text-anchor="middle">partial analogues</text>
<text x="432" y="268" class="m mu" text-anchor="middle">×3</text>
<rect x="628" y="250" width="80" height="34" class="lbg"/>
<text x="668" y="264" class="h" text-anchor="middle">convergent</text>
<text x="668" y="279" class="m mu" text-anchor="middle">practice</text>
<text x="845" y="232" class="h" text-anchor="middle">no analogue</text>
<text x="845" y="296" class="m mu" text-anchor="middle">each system's core</text>
<text x="20" y="400" class="h td">cdocs</text>
<text x="20" y="416" class="m mu">one project</text>
<text x="960" y="390" class="m mu" text-anchor="end">each session reads and writes the corpus, then ends</text>
<text x="132" y="408" class="m mu" text-anchor="end">opus</text>
<text x="132" y="426" class="m mu" text-anchor="end">sonnet</text>
<text x="132" y="444" class="m mu" text-anchor="end">haiku</text>
<rect x="150" y="398" width="70" height="12" class="bk"/><rect x="290" y="398" width="50" height="12" class="bk"/><rect x="610" y="398" width="70" height="12" class="bk"/><rect x="800" y="398" width="60" height="12" class="bk"/>
<rect x="220" y="416" width="60" height="12" class="bk"/><rect x="420" y="416" width="60" height="12" class="bk"/><rect x="680" y="416" width="70" height="12" class="bk"/><rect x="880" y="416" width="70" height="12" class="bk"/>
<rect x="160" y="434" width="40" height="12" class="bk"/><rect x="470" y="434" width="70" height="12" class="bk"/><rect x="620" y="434" width="40" height="12" class="bk"/><rect x="760" y="434" width="50" height="12" class="bk"/>
<rect x="140" y="456" width="820" height="22" rx="2" class="b" style="stroke:var(--ink);stroke-dasharray:6 3"/>
<text x="150" y="471" class="m">a long-lived specialist on one project: where the two problems converge (options 4 and 5 probe it)</text>
<rect x="140" y="490" width="820" height="28" class="fd"/>
<text x="156" y="508" class="m on">project corpus in git: devlogs · proposals · reviews · reports · rules</text>
<text x="140" y="540" class="m mu">Each session's transcript stays on the machine that ran it, unlinked from the corpus.</text>
<text x="140" y="560" class="m mu">Today's nearest mechanism, a Pillar 3 durable specialist, lasts one workstream.</text>
</svg>
