<marker id="a7k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="fk"/></marker>
</defs>
<text x="20" y="56" class="h tc">Connectome</text>
<text x="20" y="72" class="m mu">one agent</text>
<text x="140" y="34" class="m mu">day 1</text>
<text x="960" y="34" class="m mu" text-anchor="end">today</text>
<rect x="140" y="40" width="820" height="26" class="fc"/>
<text x="156" y="58" class="m on">one resident agent · months of work and social life</text>
<polygon points="140,74 960,74 960,114 140,78" class="bc"/>
<text x="140" y="132" class="m">Chronicle: every event kept, branchable, grows without bound</text>
<text x="960" y="132" class="m tc" text-anchor="end">each turn: head | folded middle | verbatim tail</text>
<g>
<rect x="140" y="152" width="112" height="42" rx="2" class="bc"/><text x="148" y="170" class="m">workspace notes</text><text x="148" y="186" class="m mu">verbatim, exact</text>
<rect x="258" y="152" width="112" height="42" rx="2" class="bc"/><text x="266" y="170" class="m">L_k merges</text><text x="266" y="186" class="m mu">automatic</text>
<rect x="376" y="152" width="112" height="42" rx="2" class="bc"/><text x="384" y="170" class="m">lessons store</text><text x="384" y="186" class="m mu">auto-injected</text>
<rect x="494" y="152" width="112" height="42" rx="2" class="bc"/><text x="502" y="170" class="m">as-of mint rule</text><text x="502" y="186" class="m mu">no hindsight</text>
<rect x="612" y="152" width="112" height="42" rx="2" class="bc"/><text x="620" y="170" class="m">shared files</text><text x="620" y="186" class="m mu">+ chat channels</text>
<rect x="730" y="152" width="112" height="42" rx="2" class="bc"/><text x="738" y="170" class="m">compiled view</text><text x="738" y="186" class="m mu">every turn</text>
<rect x="848" y="152" width="112" height="42" rx="2" class="b dsh"/><text x="856" y="170" class="m mu">(none)</text><text x="856" y="186" class="m mu">no review cycle</text>
</g>
<g>
<rect x="140" y="326" width="112" height="42" rx="2" class="bd"/><text x="148" y="344" class="m">cdocs corpus</text><text x="148" y="360" class="m mu">shared, in git</text>
<rect x="258" y="326" width="112" height="42" rx="2" class="bd"/><text x="266" y="344" class="m">devlog handoff</text><text x="266" y="360" class="m mu">by convention</text>
<rect x="376" y="326" width="112" height="42" rx="2" class="bd"/><text x="384" y="344" class="m">rules files</text><text x="384" y="360" class="m mu">human-owned</text>
<rect x="494" y="326" width="112" height="42" rx="2" class="bd"/><text x="502" y="344" class="m">doc type</text><text x="502" y="360" class="m mu">sets vantage</text>
<rect x="612" y="326" width="112" height="42" rx="2" class="bd"/><text x="620" y="344" class="m">claim files</text><text x="620" y="360" class="m mu">+ arc-state</text>
<rect x="730" y="326" width="112" height="42" rx="2" class="b dsh"/><text x="738" y="344" class="m mu">(none)</text><text x="738" y="360" class="m mu">harness assembles</text>
<rect x="848" y="326" width="112" height="42" rx="2" class="bd"/><text x="856" y="344" class="m">review cycle</text><text x="856" y="360" class="m mu">typed verdicts</text>
</g>
