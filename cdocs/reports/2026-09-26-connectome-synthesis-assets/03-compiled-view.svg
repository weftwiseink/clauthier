<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Per-turn compiled view: a write-once summary tree above; the fold solver picks one frontier through it; the rendered context is system prompt, verbatim head, a middle of recall pairs and raw chunks, a verbatim tail, and the user message with injections, capped by the budget W.">
