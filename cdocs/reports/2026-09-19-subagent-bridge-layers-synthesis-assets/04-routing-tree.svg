<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-label="Per-task routing: default to native subagents with a model and effort variant; route to ACP, OpenCode, or codex app-server only for self-contained tasks with a non-Claude advantage.">
<title>Hybrid routing decision tree</title>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566070"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a4c"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
<rect width="880" height="640" fill="#fbfbfd"/>
<text x="16" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2430">Per-task routing: native by default, bridge by exception</text>
<rect x="16" y="44" width="340" height="58" rx="6" fill="#e3edff" stroke="#2f6fdb" stroke-width="1.3"/>
<text x="186.0" y="61.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">1. Needs a non-Claude model?</text>
<text x="186.0" y="77.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">demonstrated advantage, or a</text>
<text x="186.0" y="92.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">second opinion from another lab</text>
<rect x="470" y="44" width="394" height="58" rx="6" fill="#e1f4e8" stroke="#1f8a4c" stroke-width="1.3"/>
<text x="667.0" y="61.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">Native subagent</text>
<text x="667.0" y="77.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">per-call model; effort via static variants</text>
<text x="667.0" y="92.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">(reviewer-low, reviewer-xhigh)</text>
<polyline points="356,73 470,73" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="413" y="66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2430">no</text>
<polyline points="186,102 186,132" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="196" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2430">yes</text>
<rect x="16" y="132" width="340" height="58" rx="6" fill="#e3edff" stroke="#2f6fdb" stroke-width="1.3"/>
<text x="186.0" y="149.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">2. Needs a native-only feature?</text>
<text x="186.0" y="165.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">fork, agent_id hooks, enforced worktree,</text>
<text x="186.0" y="180.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">CC skills/CLAUDE.md, large fan-out</text>
<rect x="470" y="132" width="394" height="58" rx="6" fill="#e1f4e8" stroke="#1f8a4c" stroke-width="1.3"/>
<text x="667.0" y="149.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">Native, Claude tier</text>
<text x="667.0" y="165.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">accept the model gap, or carve out a slice</text>
<text x="667.0" y="180.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">that passes step 3</text>
<polyline points="356,161 470,161" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="413" y="154" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2430">yes</text>
<polyline points="186,190 186,220" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="196" y="210" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2430">no</text>
<rect x="16" y="220" width="340" height="58" rx="6" fill="#e3edff" stroke="#2f6fdb" stroke-width="1.3"/>
<text x="186.0" y="237.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">3. Self-contained and bounded?</text>
<text x="186.0" y="253.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">prompt + repo path, one-message return,</text>
<text x="186.0" y="268.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">read-mostly or backend-sandboxed</text>
<rect x="470" y="220" width="394" height="58" rx="6" fill="#e1f4e8" stroke="#1f8a4c" stroke-width="1.3"/>
<text x="667.0" y="237.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">Native subagent</text>
<text x="667.0" y="253.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">the task is not bridge-shaped as written:</text>
<text x="667.0" y="268.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">keep it in the Claude tier or split it</text>
<polyline points="356,249 470,249" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="413" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2430">no</text>
<polyline points="186,278 186,308" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="196" y="298" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2430">yes</text>
<rect x="16" y="308" width="340" height="62" rx="6" fill="#e3edff" stroke="#2f6fdb" stroke-width="1.3"/>
<text x="186.0" y="327.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">4. Needs human permission prompts,</text>
<text x="186.0" y="343.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">or CC-side cancel to be reliable?</text>
<text x="186.0" y="358.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">(shim pieces still unverified)</text>
<rect x="470" y="308" width="394" height="62" rx="6" fill="#fdf0d5" stroke="#b7791f" stroke-width="1.3"/>
<text x="667.0" y="327.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">Gated on E1 + E2</text>
<text x="667.0" y="343.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">until both pass: read-only sandbox with</text>
<text x="667.0" y="358.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">approve-all, or stay native</text>
<polyline points="356,339 470,339" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="413" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2430">yes</text>
<polyline points="186,370 186,400" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="196" y="392" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2430">no</text>
<rect x="16" y="400" width="340" height="50" rx="6" fill="#e3edff" stroke="#2f6fdb" stroke-width="1.3"/>
<text x="186.0" y="421.275" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">5. Which backend?</text>
<text x="186.0" y="436.775" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">pick by target and session profile</text>
<rect x="16" y="500" width="268" height="66" rx="6" fill="#ece6fb" stroke="#6b46c1" stroke-width="1.3"/>
<text x="150.0" y="521.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">ACP: acpx or shim</text>
<text x="150.0" y="537.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">Codex, Gemini CLI, Goose,</text>
<text x="150.0" y="552.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">Cline, Copilot CLI</text>
<rect x="306" y="500" width="268" height="66" rx="6" fill="#ece6fb" stroke="#6b46c1" stroke-width="1.3"/>
<text x="440.0" y="521.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">OpenCode serve</text>
<text x="440.0" y="537.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">many providers, or many</text>
<text x="440.0" y="552.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">concurrent sessions</text>
<rect x="596" y="500" width="268" height="66" rx="6" fill="#ece6fb" stroke="#6b46c1" stroke-width="1.3"/>
<text x="730.0" y="521.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2430">codex app-server</text>
<text x="730.0" y="537.025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">Codex with exact per-turn</text>
<text x="730.0" y="552.525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1f2430">effort and interrupt</text>
<polyline points="186,450 186,474" fill="none" stroke="#566070" stroke-width="1.6"/>
<polyline points="150.0,474 730.0,474" fill="none" stroke="#566070" stroke-width="1.6"/>
<polyline points="150.0,474 150.0,500" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<polyline points="440.0,474 440.0,500" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<polyline points="730.0,474 730.0,500" fill="none" stroke="#566070" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="16" y="606" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#566070">E1, E2 = cancel-propagation and elicitation experiments (see Open items). Every bridge branch carries only non-Claude traffic.</text>
<text x="16" y="624" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#566070">Bridge leaves start at Stage 1 or 2 of the adoption path; OpenCode and codex app-server are Stage 3 and 4.</text>
</svg>
