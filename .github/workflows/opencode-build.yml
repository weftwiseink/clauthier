# CI workflow for OpenCode build artifacts.
# Builds from source, validates the output, and optionally publishes.
#
# Triggers on changes to plugin source files, the build script or its test, or root package files.
# Uses continue-on-error so CC-only PRs are not blocked by OC build failures.

name: OpenCode Build

on:
  push:
    branches: [main]
    paths:
      - "plugins/cdocs/**"
      - "scripts/build-opencode.ts"
      - "scripts/build-opencode.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/opencode-build.yml"
  pull_request:
    paths:
      - "plugins/cdocs/**"
      - "scripts/build-opencode.ts"
      - "scripts/build-opencode.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/opencode-build.yml"

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Build OC artifacts and run regression test
        run: npm run test:opencode

      - name: Validate npm package
        working-directory: build/cdocs/opencode
        run: npm pack --dry-run
