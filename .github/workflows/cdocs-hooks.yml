# CI for the cdocs Claude Code plugin: hooks, bin/ scripts, and rule references.
# Runs the chat-record --unit suite, the validate-cdocs-edit-path unit suite,
# and the graphify-scope unit suite against a graphify stub (bash, jq, git; no
# claude, no credentials). The headless scenarios need credentials and stay a
# manual gate. macOS runs it too, so GNU-only behavior in bin/ or the suites
# fails on BSD sed, awk, and tr there; the graphify-scope suite is Linux-only
# (bash 4+, for the graphify devcontainer).
# The rules job runs `npm run test:rules`: every rule reference in shipped
# rules, skills, and agents resolves against the rule headings, and none names
# a rule file. It lives here, not in the continue-on-error opencode-build.yml,
# so it blocks.

name: CDocs Hooks

on:
  push:
    branches: [main]
    paths:
      - "plugins/cdocs/**"
      - "scripts/check-rule-refs*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cdocs-hooks.yml"
  pull_request:
    paths:
      - "plugins/cdocs/**"
      - "scripts/check-rule-refs*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cdocs-hooks.yml"

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: rule references
        run: npm run test:rules

  chat-record-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: bash --version | head -n 1; jq --version; git --version; awk --version 2>&1 | head -n 1 || true

      - name: chat-record unit suite
        run: bash plugins/cdocs/hooks/tests/chat-record.test.sh --unit

      - name: validate-cdocs-edit-path unit suite
        run: bash plugins/cdocs/hooks/tests/validate-cdocs-edit-path.test.sh

      - name: graphify-scope unit suite
        if: runner.os == 'Linux'
        run: bash plugins/cdocs/hooks/tests/graphify-scope.test.sh
