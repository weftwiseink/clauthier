# CI for the cdocs Claude Code hooks and bin/ scripts.
# Runs the chat-record --unit suite and the validate-cdocs-edit-path unit suite
# (bash, jq, git; no claude, no credentials). The headless scenarios need
# credentials and stay a manual gate. macOS runs it too: BSD sed, awk, and tr,
# so GNU-only behavior in bin/ or the suites fails there.

name: CDocs Hooks

on:
  push:
    branches: [main]
    paths:
      - "plugins/cdocs/bin/**"
      - "plugins/cdocs/hooks/**"
      - ".github/workflows/cdocs-hooks.yml"
  pull_request:
    paths:
      - "plugins/cdocs/bin/**"
      - "plugins/cdocs/hooks/**"
      - ".github/workflows/cdocs-hooks.yml"

jobs:
  chat-record-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: bash --version | head -n 1; jq --version; git --version; awk --version 2>&1 | head -n 1 || true

      - name: chat-record unit suite
        run: bash plugins/cdocs/hooks/tests/chat-record.test.sh --unit

      - name: validate-cdocs-edit-path unit suite
        run: bash plugins/cdocs/hooks/tests/validate-cdocs-edit-path.test.sh
